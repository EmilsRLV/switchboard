[package]
name = "switchboard"
version = "0.1.0"
description = "A graph of projects, Claude Code sessions and branches"
edition = "2024"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "switchboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
serde_json = "1"

# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
