[package]
name = "switchboard"
version = "0.1.0"
description = "A graph of projects, Claude Code sessions and branches"
edition = "2024"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "switchboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
notify = "8"
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
dunce = "1"
tokio = { version = "1", features = ["time", "sync", "net"] }
# The hooks endpoint (Story 4.3): a localhost-only HTTP/1 server for Claude Code `http` hooks.
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
portable-pty = "0.9"

# Signals for terminal children (`pty`); already in the tree through portable-pty.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

# Kill-on-close Job Objects for terminal shells (`pty`); already in the tree.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Console"] }

# The PTY tests ask Windows whether a process still runs and who its children are.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
