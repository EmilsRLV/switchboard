[package]
name = "switchboard"
version = "0.1.0"
description = "A graph of projects, Claude Code sessions and branches"
edition = "2024"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "switchboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
notify = "8"
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
dunce = "1"
tokio = { version = "1", features = ["time", "sync"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
