name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One group per branch, whether the trigger was the push or the PR it belongs to, so a push to a
# PR branch runs once. On master every run completes so its artefacts survive; elsewhere a newer
# push cancels the run it supersedes.
concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    timeout-minutes: 45
    strategy:
      # A Windows failure must still show the Linux result, and vice versa.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux
            bundles: "appimage,deb"
          - os: windows-latest
            name: windows
            bundles: "nsis,msi"

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        # One shell on both runners (Git Bash on Windows), so `--` passes through to npm unchanged.
        shell: bash

    steps:
      - uses: actions/checkout@v7

      # The Linux runner has about 14 GB free; the debug test build, the release bundle build
      # and rust-cache's post-job save together filled it (Story 4.3's run failed with "No space
      # left on device" after every step had passed). Drop preinstalled toolchains we never use.
      - name: Free disk space
        if: matrix.name == 'linux'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      # Tauri's Linux prerequisites (webkit2gtk 4.1 et al.) plus the bundler extras
      # (patchelf, xdg-utils for AppImage). ubuntu-24.04 is pinned so this package set stays stable.
      - name: Install Linux dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: cargo test
        working-directory: src-tauri

      - run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      # tauri-bundler skips a bundle kind it cannot produce with a warning, not an error, and
      # upload-artifact only fails when every path is empty; require each requested kind explicitly.
      - name: Check bundles
        run: |
          shopt -s nullglob
          status=0
          for kind in $(echo "${{ matrix.bundles }}" | tr ',' ' '); do
            dir="src-tauri/target/release/bundle/$kind"
            files=("$dir"/*.AppImage "$dir"/*.deb "$dir"/*.exe "$dir"/*.msi)
            if (( ${#files[@]} > 0 )); then
              echo "ok: $kind -> ${files[*]}"
            else
              echo "::error::no installer produced for bundle kind '$kind' in $dir"
              status=1
            fi
          done
          exit $status

      - uses: actions/upload-artifact@v7
        with:
          name: switchboard-${{ matrix.name }}
          # Only the installers; the AppImage staging dir (Switchboard.AppDir/) stays behind.
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          retention-days: 14
          if-no-files-found: error
