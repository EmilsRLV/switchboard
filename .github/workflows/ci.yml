name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same ref cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      # A Windows failure must still show the Linux result, and vice versa.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux
            bundles: "appimage,deb"
          - os: windows-latest
            name: windows
            bundles: "nsis,msi"

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        # One shell on both runners (Git Bash on Windows), so `--` passes through to npm unchanged.
        shell: bash

    steps:
      - uses: actions/checkout@v7

      # Tauri's Linux prerequisites (webkit2gtk 4.1 et al.) plus the bundler extras
      # (patchelf, xdg-utils for AppImage). ubuntu-24.04 is pinned so this package set stays stable.
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: cargo test
        working-directory: src-tauri

      - run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v7
        with:
          name: switchboard-${{ matrix.name }}
          # Only the installers; the AppImage staging dir (Switchboard.AppDir/) stays behind.
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          retention-days: 14
          if-no-files-found: error
